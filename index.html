<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ink Battles</title>
<meta name="description" content="Raise a banner. Win the war. Lose no one.">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ink Battles">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,800;0,9..144,900;1,9..144,500;1,9..144,900&family=Figtree:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Ink Battles styles. Paper-and-ink look shared with Ink Legion and Ink of Arms: white paper, black ink, no other colors.
   Layout: the map fills the screen edge to edge, a header on top, a dock of unit details and actions under it. */
:root{
  --paper:#ffffff; --ink:#000000; --soft:#5c5c5c;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --ui:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1); --settle:cubic-bezier(.3,.7,.3,1);
  --dockH:170px;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#ffffff; --ink:#000000; --soft:#5c5c5c; color-scheme:light; } }
:root[data-theme="dark"]{ --paper:#ffffff; --ink:#000000; --soft:#5c5c5c; color-scheme:light; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:var(--ui)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
canvas{display:block}
[hidden]{display:none !important}

/* ---------- HUD ---------- */
#top{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 6px;background:var(--paper);
  display:grid;grid-template-columns:1fr auto;align-items:start;gap:4px 8px}
.hn{font-family:var(--display);font-weight:800;font-size:21px;line-height:1;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;font-weight:700;color:var(--soft);margin-top:2px;line-height:1.2}
.pts{text-align:right;min-width:60px;margin-right:44px}
.pv{font-family:var(--display);font-weight:800;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
#pause{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 7px);z-index:8;width:36px;height:36px;border-radius:50%;
  border:2.5px solid var(--ink);background:var(--paper);color:var(--ink);box-shadow:3px 4px 0 var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;
  transition:transform .28s var(--spring)}
#pause svg{width:20px;height:20px}
#pause:active{transform:scale(1.12,.86)}
#pause:focus-visible{outline:3px solid var(--ink);outline-offset:4px}

#callout{position:fixed;left:0;right:0;top:36%;z-index:6;text-align:center;pointer-events:none;opacity:0}
#callout b{display:block;font-family:var(--display);font-style:italic;font-weight:900;font-size:clamp(48px,15vw,84px);line-height:1;
  text-shadow:3px 4px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff}
#callout span{display:inline-block;margin-top:8px;font-size:15px;font-weight:800;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:5px 14px}
#callout span:empty{display:none}
#callout.go{animation:call 1.15s linear forwards}
@keyframes call{
  0%{opacity:0;transform:scale(.2,.2)}
  12%{opacity:1;transform:scale(1.28,.78)}
  22%{transform:scale(.88,1.16)}
  32%{transform:scale(1.05,.96)}
  40%{transform:scale(1)}
  75%{opacity:1;transform:translateY(0) scale(1)}
  82%{transform:translateY(6px) scale(1.1,.9)}
  100%{opacity:0;transform:translateY(-90px) scale(.8,1.3)}}

/* tutorial tip: a timer ring that turns into a close button, as in Ink Nine */
#tip{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:7;transform:translateX(calc(-50% - 22px));display:flex;align-items:center;gap:10px;
  width:min(420px,calc(100vw - 68px));background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;box-shadow:4px 5px 0 var(--ink);padding:10px 10px 10px 14px}
#tip.pop{animation:tipIn .45s var(--settle)}
@keyframes tipIn{0%{transform:translateX(calc(-50% - 22px)) translateY(-20px) scale(.8,1.2);opacity:0}60%{transform:translateX(calc(-50% - 22px)) scale(1.04,.96);opacity:1}100%{transform:translateX(calc(-50% - 22px))}}
#tip p{margin:0;flex:1;font-size:13.5px;font-weight:700;line-height:1.3}
#tipx{appearance:none;flex:none;width:34px;height:34px;border:0;background:none;padding:0;cursor:pointer;position:relative;color:var(--ink)}
#tipx svg{width:34px;height:34px;display:block}
#tipx .ring{fill:none;stroke:var(--ink);stroke-width:3;stroke-dasharray:88;stroke-dashoffset:88;transform:rotate(-90deg);transform-origin:50% 50%}
#tipx.run .ring{animation:ring 2.6s linear forwards}
@keyframes ring{to{stroke-dashoffset:0}}
#tipx .x{opacity:0;transition:opacity .2s}
#tipx.done .x{opacity:1}
#tipx.done .ring{stroke-dashoffset:0}
#tipx:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:50%}

/* ---------- the dock under the map ---------- */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:5;height:calc(var(--dockH) + env(safe-area-inset-bottom,0px));
  padding:9px 12px calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--paper);border-top:2.5px solid var(--ink);display:flex;flex-direction:column;gap:7px}
#dock .inner{width:min(480px,100%);margin:0 auto;display:flex;flex-direction:column;gap:6px;height:100%}
.uc{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center}
.uc canvas{width:46px;height:46px;border:2px solid var(--ink);border-radius:14px}
.uc.enemy canvas{border-style:dashed}
.un{min-width:0}
.un b{display:block;font-family:var(--display);font-style:italic;font-weight:900;font-size:19px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.un small{display:block;font-size:12px;font-weight:700;color:var(--soft);margin:1px 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uhp{text-align:right;font-variant-numeric:tabular-nums}
.uhp b{font-family:var(--display);font-weight:900;font-size:24px;line-height:1}
.uhp small{font-size:13px;font-weight:800;color:var(--soft)}
.bar{height:8px;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);transform-origin:0 50%;transition:transform .35s var(--spring)}
.bar.xp{height:6px;border-style:dashed}
.ust{display:flex;gap:5px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.ust::-webkit-scrollbar{display:none}
.ust span{flex:none;border:1.5px solid var(--ink);border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums}
.ust span.on{background:var(--ink);color:var(--paper)}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(62px,1fr));gap:7px;margin-top:auto}
.acts .btn{padding:10px 4px;font-size:14.5px}
.hintline{font-size:13px;font-weight:700;color:var(--soft);text-align:center;margin:auto 0 0}
/* battle forecast: your numbers left, theirs right */
.fc{display:grid;grid-template-columns:1fr auto 1fr;gap:0 10px;align-items:center;text-align:center}
.fc .nm{font-family:var(--display);font-style:italic;font-weight:900;font-size:17px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc .lab{font-size:11.5px;font-weight:800;color:var(--soft);min-width:34px}
.fc .v{font-family:var(--display);font-weight:900;font-size:17px;line-height:1.2;font-variant-numeric:tabular-nums}
.fc .v small{font-family:var(--ui);font-size:11.5px;font-weight:800}
.fc .adv{font-family:var(--ui);font-size:10.5px;font-weight:800;border:1.5px solid var(--ink);border-radius:999px;padding:0 6px;display:inline-block;margin-left:4px;vertical-align:2px}
.fc .adv.up{background:var(--ink);color:var(--paper)}
.fc .adv.down{border-style:dashed}
.fc .x2{font-family:var(--ui);font-size:11px;font-weight:800;background:var(--ink);color:var(--paper);border-radius:999px;padding:0 5px;margin-left:3px;vertical-align:2px}

/* ---------- cards ---------- */
#card{position:fixed;inset:0;z-index:8;display:grid;overflow-y:auto;-webkit-overflow-scrolling:touch;background:rgba(255,255,255,.8);padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
#card .panel{margin:auto}
#card.home{background:var(--paper)}
.panel{background:var(--paper);border:2.5px solid var(--ink);border-radius:24px;box-shadow:7px 8px 0 var(--ink);
  padding:22px 18px 18px;width:min(440px,100%);text-align:center;animation:cardIn .6s var(--settle)}
.panel.still{animation:none}
@keyframes cardIn{0%{transform:translateY(60vh) scale(.7,1.3)}55%{transform:translateY(-10px) scale(1.06,.94)}75%{transform:translateY(3px) scale(.98,1.02)}100%{transform:none}}
.panel h2{font-family:var(--display);font-weight:900;font-style:italic;font-size:34px;line-height:1.05;margin:0;text-wrap:balance}
.panel h3{font-family:var(--display);font-weight:800;font-size:20px;margin:4px 0 10px;text-align:left}
.panel p{margin:6px 0 16px;font-weight:700;color:var(--soft);line-height:1.4}
.logo{font-size:50px !important;margin-bottom:2px !important}
.kicker{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin:0 0 4px}
.big{font-family:var(--display);font-weight:900;font-size:52px;line-height:1;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.btn{appearance:none;border:2.5px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:14px;padding:13px 22px;
  font-family:var(--ui);font-weight:800;font-size:16px;cursor:pointer;width:100%;transition:transform .2s var(--spring)}
.btn:active{transform:scale(1.04,.9)}
.btn.ghost{background:var(--paper);color:var(--ink)}
.panel .btn + .btn{margin-top:8px}
.btn:disabled{background:var(--paper);color:var(--soft);border-style:dashed;cursor:default}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.how{text-align:left;font-size:13px;font-weight:600;border:1.5px dashed var(--ink);border-radius:12px;padding:10px 12px;margin:0 0 14px;line-height:1.45}
.how p{margin:0 0 6px !important;color:var(--ink) !important;font-weight:600 !important}
.how p:last-child{margin:0 !important}
.quote{text-align:left;font-family:var(--display);font-style:italic;font-weight:500;font-size:17px;line-height:1.4;margin:10px 0 14px;padding-left:14px;border-left:3px solid var(--ink)}
.quote small{display:block;font-family:var(--ui);font-style:normal;font-size:12px;font-weight:800;color:var(--soft);margin-top:6px}
.hero{width:100%;height:170px;margin:-6px 0 4px}
.ver{font-size:11.5px !important;font-weight:700 !important;color:var(--soft) !important;margin:12px 0 0 !important}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.panel .two .btn + .btn,.two .btn{margin-top:0}
.two + .btn,.btn + .two{margin-top:8px}

/* dialogue */
.talk{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:start;text-align:left;min-height:120px}
.talk canvas{width:84px;height:84px;border:2.5px solid var(--ink);border-radius:18px}
.talk b{display:block;font-family:var(--display);font-style:italic;font-weight:900;font-size:22px;line-height:1;margin:2px 0 6px}
.talk q{display:block;quotes:none;font-family:var(--display);font-weight:500;font-size:18px;line-height:1.38;animation:lineIn .35s var(--settle)}
@keyframes lineIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
.talk.them canvas{border-style:dashed}
.dots{display:flex;gap:5px;justify-content:center;margin:14px 0 12px}
.dots i{width:8px;height:8px;border:1.5px solid var(--ink);border-radius:50%}
.dots i.on{background:var(--ink)}

/* chapter pips and roster lists */
.prog{display:flex;gap:6px;justify-content:center;margin:0 0 12px}
.prog i{width:12px;height:12px;border:2px solid var(--ink);border-radius:50%}
.prog i.done{background:var(--ink)}
.prog i.now{background:var(--ink);transform:scale(1.35)}
.gl{display:grid;gap:8px;margin-bottom:12px;text-align:left}
.srow{appearance:none;width:100%;font-family:var(--ui);color:var(--ink);background:var(--paper);text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:2px solid var(--ink);border-radius:14px;padding:8px 10px;animation:rowIn .45s var(--settle) both;cursor:pointer}
.srow:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.srow canvas{width:44px;height:44px;border:2px solid var(--ink);border-radius:12px}
.srow.gone{border-style:dashed;cursor:default}
.srow.gone canvas{opacity:.35;border-style:dashed}
@keyframes rowIn{0%{opacity:0;transform:translateX(-18px)}70%{opacity:1;transform:translateX(3px)}100%{opacity:1;transform:none}}
.sinfo{min-width:0}
.sinfo b{display:block;font-family:var(--display);font-style:italic;font-weight:900;font-size:18px;line-height:1.1}
.sinfo small{display:block;font-size:12px;font-weight:700;color:var(--soft);line-height:1.3;margin-top:2px}
.tagx{font-family:var(--display);font-weight:900;font-size:18px;font-variant-numeric:tabular-nums;text-align:right}
.tagx small{display:block;font-family:var(--ui);font-size:11px;font-weight:800;color:var(--soft)}
.rowlab{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:800;margin:0 0 6px}
.rowlab b{font-family:var(--display);font-style:italic;font-weight:900;font-size:18px}
.carpick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 12px}
.cp{appearance:none;border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:12px;padding:6px 2px 5px;cursor:pointer;font:800 11.5px var(--ui);display:grid;justify-items:center;gap:1px;
  transition:transform .25s var(--spring)}
.cp canvas{width:44px;height:44px}
.cp small{font-size:10.5px;font-weight:700}
.cp.on{background:var(--ink);color:var(--paper);transform:translateY(-4px)}
.cp.on canvas{background:var(--paper);border-radius:10px}
.cp.lock{cursor:default}
.cp:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.foes{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 0 14px}
.foe{border:2px dashed var(--ink);border-radius:12px;padding:4px 4px 3px;display:grid;justify-items:center;font-size:10.5px;font-weight:800;width:58px}
.foe canvas{width:40px;height:40px}
.foe.boss{border-style:solid;border-width:2.5px}
.minimap{width:min(220px,70%);aspect-ratio:8/11;margin:0 auto 12px;border:2px solid var(--ink);border-radius:12px;max-width:100%}
.stage{position:relative;border:2px solid var(--ink);border-radius:18px;margin:0 0 12px;overflow:hidden;background:var(--paper)}
.stage canvas{width:100%;height:150px}
.stats{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:12.5px;font-weight:800;text-align:left;margin:0 0 12px}
.stats .sb{height:8px;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.stats .sb i{display:block;height:100%;background:var(--ink)}
.stats .n{font-family:var(--display);font-weight:900;font-size:17px;text-align:right;min-width:2.5ch;font-variant-numeric:tabular-nums}
.stats .up{display:inline-block;margin-left:6px;background:var(--ink);color:var(--paper);border-radius:999px;padding:0 6px;font-family:var(--ui);font-size:11px;animation:pipPop .5s var(--spring) both}
@keyframes pipPop{0%{transform:scale(0)}60%{transform:scale(1.5)}100%{transform:scale(1)}}
.lvl{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;text-align:left;margin:0 0 14px;font-size:13px;font-weight:800}
.lvl div{display:flex;justify-content:space-between;align-items:center;border-bottom:1.5px dashed var(--ink);padding:3px 0}
.lvl .n{font-family:var(--display);font-weight:900;font-size:18px;font-variant-numeric:tabular-nums}
.won{display:grid;gap:3px;border:2px dashed var(--ink);border-radius:14px;padding:9px 12px;margin:0 0 10px;text-align:left;animation:rowIn .5s var(--settle) both}
.won b{font-size:12px;font-weight:800;color:var(--soft)}
.won span{font-family:var(--display);font-style:italic;font-weight:900;font-size:18px;line-height:1.2}
.modes{display:grid;gap:10px;margin:12px 0 14px}
.mode{appearance:none;text-align:left;border:2.5px solid var(--ink);border-radius:18px;padding:12px 14px;background:var(--paper);color:var(--ink);cursor:pointer;font-family:var(--ui);box-shadow:4px 5px 0 var(--ink);transition:transform .2s var(--spring)}
.mode:active{transform:scale(1.03,.94)}
.mode:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.mode b{display:block;font-family:var(--display);font-style:italic;font-weight:900;font-size:21px}
.mode span{display:block;font-size:13px;font-weight:600;line-height:1.35;margin-top:2px}
.mode.on{background:var(--ink);color:var(--paper)}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.nope{animation:nope .3s}
.tri{display:flex;justify-content:center;gap:14px;align-items:center;margin:4px 0 12px;font-size:12px;font-weight:800}
.tri span{display:grid;justify-items:center;gap:3px}
.tri i{width:26px;height:26px;border:2px solid var(--ink);border-radius:8px;display:block}
.tri .sw{background:var(--ink)}
.tri .la{background:repeating-linear-gradient(-45deg,var(--ink) 0 2px,var(--paper) 2px 6px)}
.tri .ax{background:radial-gradient(circle,var(--ink) 1.6px,transparent 2px) 0 0/7px 7px}

@media (prefers-reduced-motion: reduce){
  .panel,.srow,.won,#tip.pop,.stats .up,.talk q{animation:none}
  #callout.go{animation-duration:.01s}
}
</style>
</head>
<body>
<canvas id="c" aria-label="Battle map"></canvas>
<header id="top" hidden>
  <div style="min-width:0"><div class="hn" id="hn">Chapter</div><div class="sub" id="hsub">Goal</div></div>
  <div class="pts"><div class="pv" id="turn">1</div><div class="sub" id="tsub">Turn</div></div>
</header>
<button id="pause" hidden aria-label="Pause"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg></button>
<div id="tip" hidden role="status" aria-live="polite"><p id="tipt"></p><button id="tipx" aria-label="Close tip"><svg viewBox="0 0 34 34"><circle class="ring" cx="17" cy="17" r="14"/><path class="x" d="M12 12l10 10M22 12l-10 10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button></div>
<div id="callout" aria-live="polite"><b></b><span></span></div>
<div id="dock" hidden><div class="inner" id="dockin"></div></div>
<div id="card" hidden></div>
<script>
/* Ink Battles: the rules. Pure logic, no drawing, so it can be tested on its own. */
"use strict";
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
const STATS=['hp','str','mag','skl','spd','lck','def','res'];
const STAT_NAME={hp:'HP',str:'Strength',mag:'Magic',skl:'Skill',spd:'Speed',lck:'Luck',def:'Defense',res:'Resistance'};
const CAP={hp:60,str:30,mag:30,skl:30,spd:30,lck:30,def:30,res:30};
const MAX_LV=20;

/* ---------- weapons ---------- */
// sword beats axe, axe beats lance, lance beats sword
const KINDS={sword:{name:'Sword',beats:'axe'},axe:{name:'Axe',beats:'lance'},lance:{name:'Lance',beats:'sword'},bow:{name:'Bow'},tome:{name:'Tome'},staff:{name:'Staff'}};
const WEAPONS={
  quill:{name:'Quill Blade',kind:'sword',mt:6,hit:95,crt:10,rng:[1,1],eff:['armor','horse'],note:'Triple might against armor and horses'},
  sword:{name:'Iron Sword',kind:'sword',mt:5,hit:90,crt:0,rng:[1,1]},
  killer:{name:'Killing Edge',kind:'sword',mt:8,hit:80,crt:30,rng:[1,1]},
  lance:{name:'Iron Lance',kind:'lance',mt:7,hit:80,crt:0,rng:[1,1]},
  javelin:{name:'Javelin',kind:'lance',mt:6,hit:65,crt:0,rng:[1,2]},

/* ---------- a battle ---------- */
function makeUnit(o){

}
function makeBattle(ch,roster,deploy){

  deploy.forEach((id,i)=>{ const r=roster.find(q=>q.id===id), s=slots[i]; if(!r||!s) return;
    const st={}; STATS.forEach(k=>st[k]=r[k]);
    B.units.push(makeUnit(Object.assign({id:'a_'+id,charId:id,ref:r,name:CHARS[id].name,cls:r.cls,lv:r.lv,xp:r.xp,wpn:r.wpn,team:'ally',x:s.x,y:s.y},st))); });

}
function foeUnit(f,id){

  return makeUnit(Object.assign({id,name:f.char?CHARS[f.char].name:(f.boss?f.boss.name:CLASSES[f.cls].name),cls:f.cls,lv:f.char?CHARS[f.char].lv:f.lv,wpn:f.w||CLASSES[f.cls].wpn,team:'enemy',x:f.x,y:f.y,ai:f.ai||null,boss:f.boss||null,talk:f.talk||null,charId:f.char||null},st));
}
function inb(B,x,y){ return x>=0&&y>=0&&x<B.w&&y<B.h; }
function tAt(B,x,y){ return B.map[y][x]; }

function alive(B,team){ return B.units.filter(u=>u.hp>0&&(!team||u.team===team)); }
const key=(x,y)=>x+','+y;
const dist=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y);
const wOf=u=>WEAPONS[u.wpn];
const movOf=u=>CLASSES[u.cls].mov;
// every square a unit can reach this turn; friends can be passed through, foes can't
function reach(B,u){
  const move=CLASSES[u.cls].move, all=new Map(), open=[{x:u.x,y:u.y,c:0}];
  all.set(key(u.x,u.y),{x:u.x,y:u.y,c:0,prev:null});
  while(open.length){
    let bi=0; for(let i=1;i<open.length;i++) if(open[i].c<open[bi].c) bi=i;
    const cur=open.splice(bi,1)[0]; if(cur.c>all.get(key(cur.x,cur.y)).c) continue;
    for(const [dx,dy] of DIRS){ const nx=cur.x+dx, ny=cur.y+dy; if(!inb(B,nx,ny)) continue;
      const nc=cur.c+moveCost(move,tAt(B,nx,ny)); if(nc>movOf(u)) continue;
      const o=unitAt(B,nx,ny); if(o&&o.team!==u.team) continue;
      const k=key(nx,ny), have=all.get(k); if(have&&have.c<=nc) continue;
      all.set(k,{x:nx,y:ny,c:nc,prev:key(cur.x,cur.y)}); open.push({x:nx,y:ny,c:nc}); }
  }
  const ends=[]; all.forEach(v=>{ const o=unitAt(B,v.x,v.y); if(!o||o===u) ends.push(v); });

function pathTo(R,x,y){ const out=[]; let k=key(x,y); while(k){ const n=R.all.get(k); if(!n) break; out.unshift({x:n.x,y:n.y}); k=n.prev; } return out; }

/* ---------- combat ---------- */
function canHit(u,d){ const w=wOf(u); return w.kind!=='staff'&&d>=w.rng[0]&&d<=w.rng[1]; }
function tri(a,d){ const ka=wOf(a).kind, kd=wOf(d).kind; if(KINDS[ka].beats&&KINDS[ka].beats===kd) return 1; if(KINDS[kd].beats&&KINDS[kd].beats===ka) return -1; return 0; }

}
// what happens if a attacks d while standing at (ax,ay)
function forecast(B,a,d,ax,ay){

// hits use two rolls averaged, so high odds land more often and low odds less
const roll2=rng=>(rng()*100+rng()*100)/2;
function resolve(B,a,d,rng=Math.random){

  if(f.D) order.push('d');

  const seq=[];
  for(const who of order){
    const s=who==='a'?a:d, t=who==='a'?d:a, st=who==='a'?f.A:f.D;
    if(s.hp<=0||t.hp<=0) break;
    const hit=roll2(rng)<st.hit, crit=hit&&rng()*100<st.crt;

function healAmt(u){ return WEAPONS[u.wpn].heal+u.mag; }
const TONIC=10;
// experience for one of your units after a fight
function expFor(u,foe,dealt,killed){

  const gap=foe.lv-u.lv;
  if(killed) return clamp(20+gap*3+(foe.boss?40:0),5,100);
  if(dealt>0) return clamp(10+gap,2,30);

}
const HEAL_EXP=12;

function outcome(B){

  const g=B.goal;
  if(g.kind==='boss'){ const b=B.units.find(u=>u.boss&&u.team==='enemy'); if(!b||b.hp<=0) return 'win'; }
  if(g.kind==='seize'&&B.seized) return 'win';

}
// units that arrive at the start of the enemy phase this turn
function dueReinf(B){

  const out=[];
  now.forEach((r,i)=>{ let spot=null;
    for(let d=0;d<4&&!spot;d++) for(let y=0;y<B.h&&!spot;y++) for(let x=0;x<B.w&&!spot;x++){
      if(Math.abs(x-r.x)+Math.abs(y-r.y)!==d||unitAt(B,x,y)) continue; if(isFinite(moveCost(CLASSES[r.cls].move,tAt(B,x,y)))) spot={x,y}; }
    if(!spot) return; const u=foeUnit(Object.assign({},r,spot),'r'+B.turn+'_'+i); u.fresh=true; B.units.push(u); out.push(u); });
  return out;
}
// forts and thrones mend whoever stands on them at the start of their side's phase
function terrainHeal(B,team){

// every square a unit could hit next turn
function threat(B,u){

  const R=u.ai==='hold'?{ends:[{x:u.x,y:u.y}]}:reach(B,u), r=wOf(u).rng;

/* ---------- enemy brains ---------- */
// distance, in movement cost, from every square to the nearest target square
function field(B,u,targets){

  targets.forEach(o=>{ D.set(key(o.x,o.y),0); open.push({x:o.x,y:o.y,c:0}); });
  while(open.length){
    let bi=0; for(let i=1;i<open.length;i++) if(open[i].c<open[bi].c) bi=i;
    const cur=open.splice(bi,1)[0];
    for(const [dx,dy] of DIRS){ const nx=cur.x+dx, ny=cur.y+dy; if(!inb(B,nx,ny)) continue;
      const step=moveCost(move,tAt(B,nx,ny)); if(!isFinite(step)) continue;
      const nc=cur.c+step, k=key(nx,ny); if(D.has(k)&&D.get(k)<=nc) continue; D.set(k,nc); open.push({x:nx,y:ny,c:nc}); }

  if(u.ai==='guard'||u.ai==='hold') return stay;

const TAU=Math.PI*2;

// a soft closed shape: the points act as control handles, so corners come out rounded

function frame(now){

    drawTerrain(t);

    else if(UI.danger) UI.danger.forEach(k=>{ const [x,y]=k.split(',').map(Number); cellFill(x,y,'danger',t); });
    if(UI.mode==='select'&&UI.R){ UI.hitCells.forEach(k=>{ const [x,y]=k.split(',').map(Number); cellFill(x,y,'hit',t); }); UI.R.ends.forEach(e=>cellFill(e.x,e.y,'move',t)); }

    if(CH.goal.kind==='seize'&&UI.mode==='idle') for(let y=0;y<B.h;y++) for(let x=0;x<B.w;x++) if(/[TG]/.test(B.map[y][x])&&!unitAt(B,x,y)) cellFill(x,y,'target',t);

    else if(UI.info&&UI.mode==='idle') brackets(UI.info.x,UI.info.y,t);
    B.units.slice().sort((a,b)=>(a.vy===undefined?a.y:a.vy)-(b.vy===undefined?b.y:b.vy)).forEach(u=>drawOne(u,t));

function select(u){

  UI.mode='select'; UI.sel=u; UI.info=null; UI.danger=null; UI.R=reach(B,u); UI.from={x:u.x,y:u.y};
  const hits=new Set(), rg=wOf(u).rng, ends=new Set(UI.R.ends.map(e=>key(e.x,e.y)));
  UI.R.ends.forEach(e=>{ for(let dy=-rg[1];dy<=rg[1];dy++) for(let dx=-rg[1];dx<=rg[1];dx++){ const d=Math.abs(dx)+Math.abs(dy), X=e.x+dx, Y=e.y+dy; if(d<rg[0]||d>rg[1]||!inb(B,X,Y)) continue; if(!ends.has(key(X,Y))) hits.add(key(X,Y)); } });

function tapCell(x,y){

      if(opts.length){ const cur=opts.find(e=>e.x===UI.sel.x&&e.y===UI.sel.y); const best=cur||opts.sort((a,b)=>(terr(tAt(B,b.x,b.y)).avo-terr(tAt(B,a.x,a.y)).avo)||a.c-b.c)[0];

async function walk(u,path){

  for(let i=1;i<path.length;i++){ const a=path[i-1], b=path[i]; u.flip=b.x<a.x?true:b.x>a.x?false:u.flip; sfx(hooves?'hoof':'step');

/* ---------- actions ---------- */
async function animStrike(a,t,ev){

  if(dx) a.flip=dx<0;

  if(ev.crit){ FX.flash=1; await wait(120); }
  if(d<=1&&w.kind!=='tome'){ await tween(85,k=>{ a.ox=-ux*.13+ux*.55*k; a.oy=-uy*.13+uy*.55*k; a.sq=.55-1.2*k; }); }
  else { FX.shots.push({x0:cellX(a.vx),y0:cellY(a.vy)-BOX.c*.25,x1:cellX(t.vx),y1:cellY(t.vy)-BOX.c*.25,k:0,d:w.kind==='bow'?.22:.3,kind:w.kind==='bow'?'bow':w.kind==='tome'?'tome':'throw',dark:a.wpn==='blot'});
    sfx(w.kind==='tome'?'spell':'shot'); await tween(90,k=>{ a.ox=-ux*.13*(1-k); a.oy=-uy*.13*(1-k); a.sq=.55-1.1*k; }); await wait(w.kind==='bow'?150:220); }
  if(ev.hit){ t.shp=Math.max(0,(t.shp===undefined?t.hp+ev.dmg:t.shp)-ev.dmg);
    if(ev.crit){ floatText(t,'Critical!',BOX.c*.42); FX.shake=1; splat(t,20); sfx('crit'); buzz([30,30,60]); await wait(80); }
    floatText(t,ev.dmg?String(ev.dmg):'No damage',ev.dmg?BOX.c*.55:BOX.c*.34); splat(t,6+Math.min(ev.dmg,14)); if(!ev.crit) sfx(ev.dmg?'hit':'clink'); buzz(ev.kill?35:18);

  else { floatText(t,'Miss',BOX.c*.4); sfx('miss'); tween(300,k=>{ t.ox=Math.sin(k*Math.PI)*.25*(dy?1:0); t.oy=Math.sin(k*Math.PI)*.2*(dx?-1:0); }); }
  await tween(200,k=>{ const f=1-k, m=d<=1&&w.kind!=='tome'; a.ox=(m?ux*.42:0)*f; a.oy=(m?uy*.42:0)*f; a.sq=(m?-.65:-.55)*f; },ease.out);
  a.ox=a.oy=0; a.sq=0; t.ox=t.oy=0;
}
async function knockOut(u){

  u.dying=0.001; await tween(460,k=>{ u.dying=k; u.hop=Math.sin(k*Math.PI)*.3; }); u.dying=0; u.hop=0; dirty();
  if(u.team==='ally'){
    if(u.charId!=='wren'){ B.fallen.push(u.charId); await quoteCard(u,CHARS[u.charId].death,G.mode==='casual'?`${u.name} is too hurt to fight on, and will rejoin after this chapter.`:`${u.name} has fallen and will not return.`); }
  } else if(u.boss){ callout(u.boss.name,'defeated'); await wait(700); }
}
function quoteCard(u,text,note){
  return new Promise(res=>{
    card(`<div class="talk${u.team==='enemy'?' them':''}"><canvas id="face"></canvas><div><b>${esc(u.name)}</b><q>${esc(text)}</q></div></div>${note?`<p style="margin:14px 0 12px">${esc(note)}</p>`:'<div style="height:14px"></div>'}<button class="btn" id="ok">Continue</button>`);
    liveArt($('face'),(g,w,h,t,dt,d)=>drawBust(g,u,w,h,{t,seed:1,dpr:d,foe:u.team==='enemy'&&!u.boss,boss:!!u.boss}));
    $('ok').onclick=()=>{ sfx('tap'); closeCard(); res(); };
  });

async function fight(a,d){
  // bosses have a word first
  const boss=[a,d].find(u=>u.boss&&u.team==='enemy'&&!u.spoke);
  if(boss&&boss.boss.line){ boss.spoke=true; await quoteCard(boss,boss.boss.line); }
  const a0=a.hp, d0=d.hp;
  const seq=resolve(B,a,d);
  // resolve() already changed hp; replay the fight from the starting numbers
  a.shp=a0; d.shp=d0;
  for(const ev of seq){ const s=ev.who==='a'?a:d, t=ev.who==='a'?d:a; await animStrike(s,t,ev); await wait(90); if(ev.kill){ t.shp=undefined; await knockOut(t); } }
  a.shp=undefined; d.shp=undefined;
  const dealtBy=w=>seq.filter(e=>e.who===w).reduce((s,e)=>s+e.dmg,0);
  for(const [u,foe,dealt] of [[a,d,dealtBy('a')],[d,a,dealtBy('d')]]){ if(u.hp<=0) continue; const g=expFor(u,foe,dealt,foe.hp<=0); if(g>0) await giveXp(u,g); }

async function giveXp(u,g){

  if(m.lv>=20) m.xp=0;
}
function levelCard(u,gains){

    const cur=k=>k==='hp'?u.maxhp:u[k];
    card(`<canvas id="lvart" style="width:100%;height:120px"></canvas><h2>Level ${u.lv}!</h2><p>${esc(u.name)} grew stronger.</p>

async function endTurn(){
  tipAway();
  if(B.phase!=='player') return;
  B.phase='enemy'; UI.mode='enemy'; UI.sel=null; UI.info=null; UI.danger=null; UI.targets=[];
  paintDock(`<p class="hintline" style="margin:auto 0">The enemy is moving…</p>`,'');
  callout('Enemy phase'); sfx('foeturn'); await wait(1000);
  const fresh=dueReinf(B);
  if(fresh.length){ focus(fresh[0].x,fresh[0].y,true); fresh.forEach(u=>{ u.vx=u.x; u.vy=u.y; u.seed=Math.random()*10; u.appear=0; tween(500,k=>u.appear=k).then(()=>u.appear=undefined); splat(u,8); }); callout('Reinforcements'); sfx('foeturn'); dirty(); await wait(1100); }
  await mend('enemy');
  const order=alive(B,'enemy').filter(u=>!u.fresh).sort((a,b)=>(wOf(a).kind==='staff')-(wOf(b).kind==='staff')||b.y-a.y);
  for(const r of order){
    if(r.hp<=0||r.team!=='enemy') continue;
    const p=plan(B,r);
    if(p.path.length>1||p.target){ const was=CAM.t; focus(r.x,r.y); if(CAM.on&&Math.abs(CAM.t-was)>4) await wait(320); }
    if(p.path.length>1){ await walk(r,p.path); r.x=p.x; r.y=p.y; }
    if(p.target){ const was=CAM.t; focus(p.target.x,p.target.y); if(CAM.on&&Math.abs(CAM.t-was)>4) await wait(260); }
    if(p.heal&&p.target.hp>0){ await wait(100); await doHeal(r,p.target); }
    else if(p.raze&&tAt(B,r.x,r.y)==='v'){ B.map[r.y][r.x]='x'; delete B.villages[key(r.x,r.y)]; B.razed++; splat(r,16); sfx('raze'); floatText(r,'Burned',BOX.c*.42); await wait(700); }
    else if(p.target&&p.target.hp>0){ await wait(120); await fight(r,p.target); if(await checkEnd()) return; }
    else if(p.path.length>1) await wait(60);
  }
  B.units.forEach(u=>u.fresh=false);
  if(CH.goal.kind==='survive'&&B.turn>=CH.goal.turns){ UI.mode='off'; await wait(300); return endBattle('win'); }
  B.turn++; B.phase='player'; alive(B,'ally').forEach(u=>u.acted=false); dirty(); hud();
  { const w=alive(B,'ally').find(u=>u.charId==='wren'); if(w) focus(w.x,w.y,true); }
  UI.mode='busy'; await mend('ally');
  UI.mode='idle';
  callout('Player phase',CH.goal.kind==='survive'?`${CH.goal.turns-B.turn+1} turn${CH.goal.turns-B.turn+1===1?'':'s'} to hold`:''); sfx('turn'); dockIdle();
  if(CH.id==='c1'&&B.turn===2) setTimeout(()=>tip('danger','Tap Danger to see every square the enemy can hit next turn.'),1200);
}
function goalText(){ const g=CH.goal; return g.kind==='survive'?`Survive ${g.turns} turns`:g.kind==='seize'?'Seize the '+(CH.map.join('').includes('G')?'gate':'throne')+' with Wren':g.kind==='boss'?'Defeat '+CH.foes.find(f=>f.boss).boss.name:'Defeat every enemy'; }
function hud(){ $('hn').textContent=CH.name; $('hsub').textContent=goalText(); $('turn').textContent=B.turn; $('tsub').textContent=CH.goal.kind==='survive'?'of '+CH.goal.turns:'Turn'; }

/* Ink Battles: the save file, the title, camp between chapters, and every card around the battles. */
"use strict";

const HOW=`<div class="how"><p>Tap one of your units, then a square to move it. Then Attack, Heal, Talk, Visit or Wait.</p>

    g.strokeStyle='#000'; g.lineWidth=2; g.setLineDash([3,5]); g.beginPath(); g.moveTo(w*.06,base+4); g.lineTo(w*.94,base+4); g.stroke(); g.setLineDash([]);

/* ---------- chapters ---------- */
async function startChapter(i){
  hideBattleUI(); B=null;
  const ch=CHAPTERS[i];
  ch.joins.forEach(id=>{ if(!G.roster.some(r=>r.id===id)&&!G.fallen.includes(id)) G.roster.push(newRecord(id)); });
  save();
  await scene(ch.intro,{title:`Chapter ${i+1} · ${ch.name}`,home:true,done:'Prepare'});
  prep(i);
}
function slotsOf(ch){ return ch.map.join('').replace(/[^1-9]/g,'').length; }
function prep(i){
  hideBattleUI(); B=null;
  const ch=CHAPTERS[i], cap=slotsOf(ch), avail=G.roster.slice();
  const pick=new Set(['wren'].concat(avail.filter(r=>r.id!=='wren').sort((a,b)=>b.lv-a.lv).map(r=>r.id)).slice(0,cap));
  const counts={}; ch.foes.filter(f=>!f.boss&&!f.char).forEach(f=>counts[f.cls]=(counts[f.cls]||0)+1);
  const extra=(ch.reinf||[]).length;
  const draw=()=>{
    card(`${pips(i)}<p class="kicker">Chapter ${i+1}</p><h2>${esc(ch.name)}</h2><p style="margin-bottom:10px">${esc(ch.place)}</p>
      <canvas class="minimap" id="mini"></canvas>
      <div class="how"><p><b>Goal:</b> ${esc(goalOf(ch))}.${ch.goal.kind!=='boss'?'':' Everyone else is optional.'} If Wren falls, the battle is lost.</p>${ch.tip?`<p>${esc(ch.tip)}</p>`:''}</div>
      <div class="rowlab"><b>The enemy</b><span>${ch.foes.length} on the map${extra?`, ${extra} more coming`:''}</span></div>
      <div class="foes">${ch.foes.filter(f=>f.boss).map(f=>`<div class="foe boss">${who(f.cls,1)}${esc(f.boss.name.replace(/^The /,''))}</div>`).join('')}
        ${ch.foes.filter(f=>f.char).map(f=>`<div class="foe">${who(f.char,1)}${esc(CHARS[f.char].name)}</div>`).join('')}
        ${Object.entries(counts).map(([c,n])=>`<div class="foe">${who(c,1)}${esc(CLASSES[c].name.split(' ')[0])}${n>1?' ×'+n:''}</div>`).join('')}</div>
      <div class="rowlab"><b>Your band</b><span>${pick.size} of ${Math.min(cap,avail.length)} deployed</span></div>
      <div class="carpick">${avail.map(r=>`<button class="cp${pick.has(r.id)?' on':''}${r.id==='wren'?' lock':''}" data-id="${r.id}" aria-pressed="${pick.has(r.id)}">${who(r.id)}${esc(CHARS[r.id].name)}<small>Lv ${r.lv} ${esc(CLASSES[r.cls].name.split(' ')[0])}</small></button>`).join('')}</div>
      <button class="btn" id="start">Start the battle</button><button class="btn ghost" id="back">${i===0&&!G.fallen.length&&G.roster.length<=3?'Title screen':'Back to camp'}</button>`,{home:true,still:draw.n++>0});
    miniMap($('mini'),ch);

      if(id==='wren'){ b.classList.remove('nope'); void b.offsetWidth; b.classList.add('nope'); sfx('nope'); return; }
      if(pick.has(id)) pick.delete(id); else if(pick.size<cap) pick.add(id); else { b.classList.remove('nope'); void b.offsetWidth; b.classList.add('nope'); sfx('nope'); return; }
      sfx('pick'); draw(); });
    $('start').onclick=()=>{ sfx('go'); startBattle(i,[...pick].sort((a,b)=>(a==='wren'?-1:b==='wren'?1:0))); };
    $('back').onclick=()=>{ sfx('tap'); if(G.ch===0&&G.roster.length<=3) home(); else camp(); };
  }; draw.n=0; draw();
}
function goalOf(ch){ const g=ch.goal; return g.kind==='survive'?`Survive ${g.turns} turns`:g.kind==='seize'?`Move Wren onto the ${ch.map.join('').includes('G')?'gate':'throne'} and seize it`:g.kind==='boss'?`Defeat ${ch.foes.find(f=>f.boss).boss.name}`:'Defeat every enemy'; }
function miniMap(c,ch){
  const d=Math.min(2,window.devicePixelRatio||1), w=c.clientWidth, h=c.clientHeight; c.width=Math.round(w*d); c.height=Math.round(h*d);
  const g=c.getContext('2d'); g.setTransform(d,0,0,d,0,0); const cs=w/8;
  ch.map.forEach((row,y)=>[...row].forEach((k,x)=>{ const X=x*cs, Y=y*cs;
    if(k==='W'){ g.fillStyle='#000'; g.fillRect(X,Y,cs+.5,cs+.5); }
    else if(k==='~'){ g.fillStyle=patIn(g,'hatch',d*.35); g.globalAlpha=.5; g.fillRect(X,Y,cs,cs); g.globalAlpha=1; }
    else if(k==='f'||k==='m'||k==='c'){ g.beginPath(); g.arc(X+cs/2,Y+cs/2,cs*.26,0,TAU); g.lineWidth=1.3; g.strokeStyle='#000'; g.stroke(); if(k==='m'){ g.fillStyle='#000'; g.fill(); } }
    else if(/[FTGv]/.test(k)){ g.beginPath(); g.rect(X+cs*.22,Y+cs*.22,cs*.56,cs*.56); g.lineWidth=1.6; g.strokeStyle='#000'; g.stroke(); if(k!=='v'){ g.fillStyle='#000'; g.fill(); } }
    else if(/[1-9]/.test(k)){ g.beginPath(); g.arc(X+cs/2,Y+cs/2,cs*.2,0,TAU); g.fillStyle='#000'; g.fill(); } }));
  ch.foes.forEach(f=>{ g.beginPath(); g.arc((f.x+.5)*cs,(f.y+.5)*cs,cs*(f.boss?.3:.22),0,TAU); g.fillStyle='#fff'; g.fill(); g.setLineDash([2,2]); g.lineWidth=1.6; g.strokeStyle='#000'; g.stroke(); g.setLineDash([]); if(f.boss){ g.beginPath(); g.arc((f.x+.5)*cs,(f.y+.5)*cs,cs*.1,0,TAU); g.fillStyle='#000'; g.fill(); } });
}

/* ---------- a battle ---------- */
function startBattle(i,ids){
  CH=CHAPTERS[i]; BOX.set=0; CAM.v=CAM.t=1e6;
  // fight with a copy of the band so a loss or a retreat changes nothing
  ROSTER=JSON.parse(JSON.stringify(G.roster));
  B=makeBattle(CH,ROSTER,ids); B.chIndex=i; B.fallen=[]; B.recruits=[]; B.levels=[]; B.gifts=[]; B.razed=0;
  B.units.forEach(u=>{ u.vx=u.x; u.vy=u.y; u.seed=Math.random()*10; });
  seedBoard(); closeCard(); $('top').hidden=false; $('dock').hidden=false; $('pause').hidden=false;
  UI.mode='idle'; UI.sel=null; UI.info=null; UI.danger=null; UI.dangerAll=false; dirty();
  hud(); dockIdle(); layout();
  callout('Player phase',goalOf(CH));
  if(CH.id==='c1') setTimeout(()=>tip('sel','Tap Wren to see every square in reach.'),1300);
  if(CH.tip) setTimeout(()=>tip('ch_'+CH.id,CH.tip),1400);
}
function endBattle(o){
  hideBattleUI();
  const win=o==='win', i=B.chIndex, last=i===CHAPTERS.length-1;
  const lord=B.units.find(u=>u.charId==='wren');
  if(win){
    // keep the levels and gifts from this battle, and anyone who joined
    B.units.filter(u=>u.team==='ally'&&u.ref&&B.recruits.includes(u.charId)).forEach(u=>{ if(!ROSTER.some(r=>r.id===u.charId)&&(u.hp>0||G.mode==='casual')) ROSTER.push(u.ref); });
    G.roster=ROSTER.filter(r=>G.mode==='casual'||!B.fallen.includes(r.id));
    if(G.mode==='classic') B.fallen.forEach(id=>{ if(!G.fallen.includes(id)) G.fallen.push(id); });
    G.ch=i+1; if(last) G.done=true; save();
    sfx('win');
    card(`${pips(i+1<CHAPTERS.length?i+1:i)}<canvas id="resart" style="width:100%;height:120px"></canvas>
      <h2>Chapter clear</h2><p>${esc(CH.name)} in ${B.turn} turn${B.turn===1?'':'s'}.</p>
      ${B.recruits.length?`<div class="won"><b>Joined your band</b><span>${B.recruits.map(id=>CHARS[id].name).join(', ')}</span></div>`:''}
      ${B.levels.length?`<div class="won"><b>Leveled up</b><span>${B.levels.join(', ')}</span></div>`:''}
      ${B.gifts.length?`<div class="won"><b>Gifts from villages</b><span>${B.gifts.join(', ')}</span></div>`:''}
      ${B.razed?`<div class="won"><b>Villages burned</b><span>${B.razed}</span></div>`:''}
      ${B.fallen.length?`<div class="won"><b>${G.mode==='casual'?'Wounded, back next chapter':'Fallen'}</b><span>${B.fallen.map(id=>CHARS[id].name).join(', ')}</span></div>`:''}
      <button class="btn" id="ok">${last?'Epilogue':'To camp'}</button>`,{home:true});
    const cast=alive(B,'ally').slice(0,3);
    liveArt($('resart'),(g,w,h,t,dt,d)=>{ cast.forEach((u,k)=>{ const x=w/2+(k-(cast.length-1)/2)*h*.85, j=Math.abs(Math.sin(t*3.2+k))*h*.1;
      g.beginPath(); g.ellipse(x,h*.92,h*.18,h*.04,0,0,TAU); g.fillStyle='#000'; g.fill(); drawUnit(g,u,x,h*.92-j,h*.62,{t,seed:k,dpr:d,sq:j<2?.3:-.1}); }); });
    $('ok').onclick=()=>{ sfx('tap'); if(last) ending(); else camp(); };
  } else {
    sfx('lose');
    card(`<canvas id="resart" style="width:100%;height:110px"></canvas><h2>Defeat</h2>
      <div class="quote">${esc(CHARS.wren.death)}<small>Wren</small></div>
      <p>Wren has fallen. Nothing from this battle is kept. Try the chapter again with what you learned.</p>
      <button class="btn" id="retry">Try again</button><button class="btn ghost" id="ok">To camp</button>`,{home:true});
    liveArt($('resart'),(g,w,h,t,dt,d)=>{ g.beginPath(); g.ellipse(w/2,h*.92,h*.2,h*.04,0,0,TAU); g.fillStyle='#000'; g.fill(); drawUnit(g,lord,w/2,h*.92,h*.62,{t,seed:1,dpr:d,sq:.3}); });
    $('retry').onclick=()=>{ sfx('tap'); prep(i); };
    $('ok').onclick=()=>{ sfx('tap'); camp(); };
  }
}

/* ---------- camp ---------- */
function camp(){
  hideBattleUI(); B=null;
  if(G.done) return ending();
  const i=G.ch, ch=CHAPTERS[i];
  card(`${pips(i)}<h2>Camp</h2><p>${i===0?'Before the first battle.':`${i} chapter${i>1?'s':''} behind you. ${CHAPTERS.length-i} to go.`} ${G.mode==='classic'?'Classic rules.':'Casual rules.'}</p>
    <div class="rowlab"><b>Your band</b><span>${G.roster.length}</span></div>
    <div class="gl">${G.roster.map((r,k)=>`<button class="srow" data-id="${r.id}" style="animation-delay:${k*.04}s">${who(r.id)}<div class="sinfo"><b>${esc(CHARS[r.id].name)}</b><small>${esc(CLASSES[r.cls].name)} · ${esc(WEAPONS[r.wpn].name)}</small></div><div class="tagx">Lv ${r.lv}<small>${r.xp} exp · ${r.hp} HP</small></div></button>`).join('')}
      ${G.fallen.map(id=>`<div class="srow gone">${who(id)}<div class="sinfo"><b>${esc(CHARS[id].name)}</b><small>Fallen</small></div><div></div></div>`).join('')}</div>
    <button class="btn" id="next">Chapter ${i+1}: ${esc(ch.name)}</button><button class="btn ghost" id="how">How to play</button><button class="btn ghost" id="quit">Title screen</button>`,{home:true});
  document.querySelectorAll('.srow[data-id]').forEach(b=>b.onclick=()=>{ sfx('tap'); const r=G.roster.find(q=>q.id===b.dataset.id); rosterCard(r); });
  $('next').onclick=()=>{ sfx('go'); startChapter(i); };
  $('how').onclick=()=>{ sfx('tap'); howCard(camp); };
  $('quit').onclick=()=>{ sfx('tap'); home(); };
}
function rosterCard(r){
  const u=recUnit(r), w=WEAPONS[r.wpn];
  const bar=k=>`<div>${STAT_NAME[k]}</div><div class="sb"><i style="width:${Math.round(Math.min(1,r[k]/(k==='hp'?60:30))*100)}%"></i></div><div class="n">${r[k]}</div>`;
  card(`<div class="stage"><canvas id="stat"></canvas></div><h2>${esc(u.name)}</h2><p style="margin-bottom:10px">Level ${r.lv} ${CLASSES[r.cls].name} · ${r.xp} exp</p>
    <div class="stats">${STATS.map(bar).join('')}</div>
    <div class="how"><p><b>${w.name}</b> · ${KINDS[w.kind].name}${w.kind==='staff'?`, heals ${w.heal+r.mag}`:`, might ${w.mt}, hit ${w.hit}${w.crt?', crit '+w.crt:''}`}${w.note?'. '+w.note:''}.</p><p>${esc(CHARS[r.id].bio)}</p></div>
    <button class="btn" id="ok">Back to camp</button>`,{home:true});
  liveArt($('stat'),(g,wd,h,t,dt,d)=>{ g.beginPath(); g.ellipse(wd/2,h*.88,h*.22,h*.05,0,0,TAU); g.fillStyle='#000'; g.fill(); drawUnit(g,u,wd/2,h*.88,h*.66,{t,seed:2,dpr:d}); });
  $('ok').onclick=()=>{ sfx('tap'); camp(); };
}
async function ending(){
  hideBattleUI(); B=null;
  if(!ending.seen){ ending.seen=true; await scene(EPILOGUE,{title:'Epilogue',home:true,done:'The end'}); }
  const band=G.roster.map(r=>r.id);
  card(`<canvas id="endart" style="width:100%;height:150px"></canvas><h2>The banners are white</h2>
    <p>The Smudge King is gone, and the ink runs clear again.</p>
    <div class="won"><b>Stood with Wren at the end</b><span>${band.map(id=>CHARS[id].name).join(', ')}</span></div>
    ${G.fallen.length?`<div class="won"><b>Remembered</b><span>${G.fallen.map(id=>CHARS[id].name).join(', ')}</span></div>`:`<div class="won"><b>Nobody was lost</b><span>Everyone came home.</span></div>`}
    <button class="btn" id="again">New campaign</button><button class="btn ghost" id="ok">Title screen</button>`,{home:true});
  const cast=band.slice(0,5);
  liveArt($('endart'),(g,w,h,t,dt,d)=>{ cast.forEach((id,k)=>{ const x=w/2+(k-(cast.length-1)/2)*Math.min(h*.62,w/(cast.length+.5)), j=Math.abs(Math.sin(t*3+k*.7))*h*.08;
    g.beginPath(); g.ellipse(x,h*.9,h*.14,h*.035,0,0,TAU); g.fillStyle='#000'; g.fill(); drawUnit(g,whoOf(id),x,h*.9-j,h*.5,{t,seed:k,dpr:d,sq:j<2?.25:-.1}); }); });
  $('again').onclick=()=>{ sfx('tap'); pickMode(); };
  $('ok').onclick=()=>{ sfx('tap'); home(); };
}
function pauseMenu(){
  if(!B||UI.mode==='busy'||UI.mode==='enemy'||!$('card').hidden) return;
  const prev=UI.mode; UI.mode='off';
  card(`<h2>Paused</h2><p>${esc(CH.name)}, turn ${B.turn}. ${esc(goalOf(CH))}.</p>${HOW}
    <button class="btn" id="res">Resume</button><button class="btn ghost" id="restart">Restart chapter</button><button class="btn ghost" id="ret">Retreat to camp</button>`);
  $('res').onclick=()=>{ sfx('tap'); closeCard(); UI.mode=prev==='off'?'idle':prev; };
  $('restart').onclick=()=>{ sfx('tap'); prep(B.chIndex); };
  $('ret').onclick=()=>{ sfx('tap'); camp(); };
}
$('pause').onclick=()=>{ sfx('tap'); pauseMenu(); };

/* ---------- start-up ---------- */
addEventListener('resize',resize); resize(); makePats();
requestAnimationFrame(frame);
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>home());
</script>
</body>
