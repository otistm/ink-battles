<canvas id="c" aria-label="Battle map"></canvas>
<header id="top" hidden>

  <div class="pts"><div class="pv" id="turn">1</div><div class="sub" id="tsub">Turn</div></div>
</header>
<button id="pause" hidden aria-label="Pause"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg></button>
<div id="tip" hidden role="status" aria-live="polite"><p id="tipt"></p><button id="tipx" aria-label="Close tip"><svg viewBox="0 0 34 34"><circle class="ring" cx="17" cy="17" r="14"/><path class="x" d="M12 12l10 10M22 12l-10 10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button></div>
<div id="callout" aria-live="polite"><b></b><span></span></div>
<div id="dock" hidden><div class="inner" id="dockin"></div></div>
<div id="card" hidden></div>
